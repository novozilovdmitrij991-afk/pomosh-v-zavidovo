<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Помощь в Завидово — Дмитрий</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f5f3ed;color:#172019;font-family:Arial,sans-serif;line-height:1.5}
.wrap{width:min(92%,1050px);margin:auto}
header{border-bottom:1px solid #ddd;padding:20px 0}
.head{display:flex;justify-content:space-between;align-items:center;gap:15px}
.logo{font-size:20px;font-weight:800}
a{color:inherit;text-decoration:none}
.phone{font-weight:800}
.hero{padding:70px 0}
.tag{color:#315d42;font-size:14px;font-weight:800;letter-spacing:1.5px}
h1{font-size:clamp(45px,8vw,80px);line-height:1;margin:18px 0 25px;max-width:850px}
.lead{font-size:22px;color:#687069;max-width:750px}
.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{padding:16px 23px;border:2px solid #315d42;border-radius:12px;font-weight:800}
.main{background:#315d42;color:white}
.note{color:#687069;margin-top:18px}
section{padding:60px 0}
h2{font-size:40px;margin:0 0 12px}
.sub{color:#687069;font-size:19px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:white;border:1px solid #ddd;border-radius:18px;padding:25px}
.card b{font-size:22px}
.card p{color:#687069;margin-bottom:0}
.green{background:#315d42;color:white}
.green .sub{color:#d8e0da}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.step{border-top:1px solid #8aa08f;padding-top:20px}
.step b{font-size:21px}
.step p{color:#d8e0da}
.contact{background:white;border-radius:20px;padding:30px;border:1px solid #ddd}
.bigphone{font-size:30px;font-weight:900;display:block;margin:25px 0}
footer{padding:30px 0;border-top:1px solid #ddd;color:#687069}
@media(max-width:650px){
header{padding:16px 0}.logo{font-size:17px}.phone{font-size:14px}
.hero{padding:55px 0}h1{font-size:48px}.lead{font-size:20px}
section{padding:50px 0}h2{font-size:34px}
.grid,.steps{grid-template-columns:1fr}
.buttons .btn{flex:1;text-align:center}
}
</style>
</head>

<body>

<header>
<div class="wrap head">
<div class="logo">Помощь в Завидово</div>
<a class="phone" href="tel:+79607185126">8 960 718-51-26</a>
</div>
</header>

<div class="wrap hero">
<div class="tag">ДМИТРИЙ · ЗАВИДОВО И РЯДОМ</div>
<h1>Ваш человек на месте в Завидово</h1>
<div class="lead">
Не можете приехать сами? Проверю дом или участок, встречу доставку или мастера, помогу с перевозкой, вывозом и бытовыми задачами.
</div>
